name: Paperator daily paper

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC every morning -- adjust to your timezone
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paperator
  cancel-in-progress: false

jobs:
  send-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send today's paper
        working-directory: agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 send_daily_paper.py
      - name: Commit reading-list update
        run: |
          git config user.name "paperator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reading-list.md
          git diff --cached --quiet || git commit -m "Paperator: mark paper sent [skip ci]"
          git pull --no-rebase --no-edit origin main
          git push
